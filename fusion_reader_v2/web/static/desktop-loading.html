<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panda Fusión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="desktop-loading">
  <main class="desktop-loading-card">
    <img class="desktop-loading-emblem" src="panda-fusion-emblem.webp" alt="">
    <p class="desktop-loading-label">PANDA FUSIÓN / ESCRITORIO</p>
    <h1>Preparando el lector</h1>
    <p>La ventana está esperando el servidor local y la voz. No cierres esta pantalla.</p>
    <div class="desktop-loading-pulse" aria-label="Iniciando"></div>
    <p class="desktop-loading-detail">Si no cambia después de un minuto, verificá que <code>fusionctl start</code> pueda iniciarse desde una terminal.</p>
  </main>
</body>
</html>
