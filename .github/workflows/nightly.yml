name: Nightly

on:
  pull_request:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: Repetition and leak checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements/constraints-py312.txt -e '.[dev]'
      - run: python -m unittest discover -s tests/stress -p 'stress_*.py' -v
      - run: python -m scripts.benchmark_synthetic_reader --check
