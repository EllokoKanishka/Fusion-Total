name: One-shot Ruff format

on:
  push:
    branches:
      - feat/stt-per-job-context-2026-09
    paths:
      - fusion_reader_v2/dialogue.py
      - .github/workflows/one-shot-ruff-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/stt-per-job-context-2026-09
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.15.21'
      - name: Format and commit if needed
        run: |
          ruff format fusion_reader_v2/dialogue.py
          if git diff --quiet -- fusion_reader_v2/dialogue.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fusion_reader_v2/dialogue.py
          git commit -m 'style: format STT provider context changes'
          git push origin HEAD:feat/stt-per-job-context-2026-09
