name: One-shot dictation reader reliability

on:
  push:
    branches:
      - fix/dictation-reader-lucy-reliability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dictation-reader-lucy-reliability
          fetch-depth: 0

      - name: Apply reliability fixes
        run: python3 .github/one_shot_apply_dictation_reader.py

      - name: Install focused test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -c requirements/constraints-py312.txt -e '.[dev]'
          npm ci

      - name: Format and focused regressions
        run: |
          ruff format fusion_reader_v2/dictation.py fusion_reader_v2/dictation_assistant.py fusion_reader_v2/conversation.py fusion_reader_v2/facade.py fusion_reader_v2/web/routes/dictation.py tests/test_dictation_reliability_fix.py
          ruff check fusion_reader_v2/dictation.py fusion_reader_v2/dictation_assistant.py fusion_reader_v2/conversation.py fusion_reader_v2/facade.py fusion_reader_v2/web/routes/dictation.py tests/test_dictation_reliability_fix.py
          python3 -m unittest tests.test_dictation_reliability_fix tests.test_dictation tests.test_dictation_assistant -v
          node --test tests/dictation_module.test.js tests/dictation_reliability_fix.test.js
          bash -n scripts/start_fusion_reader_v2.sh
          git diff --check

      - name: Commit fix and remove one-shot helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fusion_reader_v2 scripts/fusionctl.py scripts/start_fusion_reader_v2.sh tests docs
          git commit -m 'fix(dictation): restore reader voice and reliable Lucy editing'
          git rm .github/workflows/one-shot-dictation-reader-reliability.yml .github/one_shot_apply_dictation_reader.py
          git commit -m 'chore: remove one-shot reliability helpers'
          git push origin HEAD:fix/dictation-reader-lucy-reliability
