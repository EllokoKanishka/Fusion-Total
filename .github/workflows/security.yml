name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Dependency and boundary audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements/constraints-py312.txt -e '.[dev]'
      - run: pip-audit
      - run: python scripts/check_dependency_constraints.py
      - run: python scripts/check_secret_patterns.py
      - run: python -m unittest tests.unit.test_config tests.unit.test_persistence tests.unit.test_audio_cache tests.unit.test_jobs -v

  codeql:
    name: CodeQL Python and JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3
