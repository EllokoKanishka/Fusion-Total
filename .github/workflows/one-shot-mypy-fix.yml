name: One-shot mypy fix

on:
  push:
    branches:
      - feat/stt-per-job-context-2026-09
    paths:
      - .github/workflows/one-shot-mypy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/stt-per-job-context-2026-09
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements/constraints-py312.txt -e '.[dev]'
      - name: Apply typed keyword fix, validate, and remove this helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('fusion_reader_v2/dialogue.py')
          text = path.read_text(encoding='utf-8')
          old = '''        return self.transcribe_file_cancellable(\n            path,\n            mime=mime,\n            language=language,\n            **_stt_context_kwargs(initial_prompt, hotwords),\n        )\n'''
          new = '''        return self.transcribe_file_cancellable(\n            path,\n            mime=mime,\n            language=language,\n            initial_prompt=_bounded_stt_context(initial_prompt),\n            hotwords=_bounded_stt_context(hotwords),\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Whisper CLI call to replace, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          ruff format fusion_reader_v2/dialogue.py
          mypy fusion_reader_v2
          git rm .github/workflows/one-shot-mypy-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fusion_reader_v2/dialogue.py
          git commit -m 'fix(stt): pass CLI context with typed keywords'
          git push origin HEAD:feat/stt-per-job-context-2026-09
