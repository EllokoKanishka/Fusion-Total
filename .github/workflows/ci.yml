name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-core:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            constraint: requirements/constraints-py311.txt
          - python-version: '3.12'
            constraint: requirements/constraints-py312.txt
    steps:
      - uses: actions/checkout@v4
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c '${{ matrix.constraint }}' -e '.[dev]'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m py_compile $(find fusion_reader_v2 scripts tests -name '*.py' -type f | sort)

  quality:
    name: Python quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements/constraints-py312.txt -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy fusion_reader_v2
      - run: python scripts/check_docs_consistency.py
      - run: python scripts/check_dependency_constraints.py
      - run: coverage run --branch -m unittest discover -s tests -p 'test_*.py'
      - run: coverage run --branch --append -m unittest discover -s tests/stress -p 'stress_*.py'
      - run: coverage json -o coverage.json
      - run: python scripts/check_coverage_thresholds.py coverage.json
      - run: coverage report --fail-under=0
      - run: coverage xml
      - run: git diff --check

  package:
    name: Non-editable wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python scripts/check_wheel_assets.py dist/*.whl
      - name: Install and inspect wheel outside checkout
        run: |
          python -m venv /tmp/fusion-wheel
          /tmp/fusion-wheel/bin/python -m pip install --upgrade pip
          /tmp/fusion-wheel/bin/python -m pip install -c requirements/constraints-py312.txt dist/*.whl
          cd /tmp
          /tmp/fusion-wheel/bin/python - <<'PY'
          from importlib.resources import files

          from fusion_reader_v2 import FusionReaderV2
          from fusion_reader_v2.service import FusionReaderV2 as LegacyFusionReaderV2

          assert FusionReaderV2 is LegacyFusionReaderV2
          static = files("fusion_reader_v2").joinpath("web/static")
          expected = (
              "index.html",
              "styles.css",
              "app.js",
              "busy_controls.js",
              "js/api.mjs",
              "js/audio.mjs",
              "js/audio_export.mjs",
              "js/bootstrap.mjs",
              "js/busy.mjs",
              "js/dialogue.mjs",
              "js/notes.mjs",
              "js/preparation.mjs",
              "js/ui.mjs",
          )
          missing = [name for name in expected if not static.joinpath(name).is_file()]
          assert not missing, missing
          PY
          /tmp/fusion-wheel/bin/fusionctl version

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find scripts -name '*.sh' -type f -print0 | sort -z | xargs -0 -n1 bash -n
      - run: find scripts -name '*.sh' -type f -print0 | sort -z | xargs -0 shellcheck

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:ui
