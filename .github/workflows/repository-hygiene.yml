name: Repository hygiene
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: repository-hygiene
  cancel-in-progress: false
jobs:
  audit-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit current branch commits without deleting refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/repository_hygiene.py
